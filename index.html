<!DOCTYPE html>

        <div class="bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-xl text-amber-400 font-bold text-sm">

        </div>
    </div>

                <div class="text-6xl mb-2">🐱📦</div>
                <span class="text-slate-900 font-black tracking-wider text-sm bg-amber-200/80 px-3 py-1 rounded-lg">КОТЭКУБ</span>
            </div>
        </button>
        
        <p class="text-xs text-slate-500 mt-6">+<span id="clickPower">1</span> рыба за клик</p>

        <div class="space-y-2">
            <!-- Апгрейд клика -->
            <button onclick="buyUpgrade()" class="w-full bg-slate-700/60 hover:bg-slate-700 border border-slate-600 p-3 rounded-xl flex justify-between items-center transition">

                    <div class="text-xs text-slate-400">Цена: <span id="upgradeCost">15</span> рыбы</div>
                </div>
                <div class="bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs">Купить</div>
            </button>
        </div>
    </div>

            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }
