<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kotekub Craft - MC Hardcore Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: var(--sky-bg, linear-gradient(to bottom, #4a90e2 0%, #87ceeb 50%, #76a84c 50%, #4c8225 100%));
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            transition: background 1s ease;
        }

        .celestial-body {
            position: absolute;
            top: 30px;
            right: 40px;
            width: 50px;
            height: 50px;
            z-index: 1;
            transition: opacity 1s ease, transform 1s ease;
        }

        .pixel-sun {
            background: #ffeb3b;
            box-shadow: 0 0 20px #ff9800, inset -6px -6px 0px #f57c00;
        }

        .pixel-moon {
            background: #f1f2f6;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6), inset -6px -6px 0px #ced6e0;
            border-radius: 4px;
        }

        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #ffffff;
            width: 4px;
            height: 4px;
            box-shadow: 0 0 6px #fff;
        }

        .scenery {
            position: absolute;
            bottom: 45vh;
            width: 100%;
            height: 170px;
            pointer-events: none;
            z-index: 1;
            filter: brightness(var(--scenery-brightness, 1));
            transition: filter 1s ease;
        }

        .sand-dune {
            position: absolute;
            bottom: 0;
            left: -10px;
            width: 140px;
            height: 70px;
            background: #d4ac0d;
            border-top: 4px solid #b7950b;
            border-radius: 50% 50% 0 0;
        }

        .rock {
            position: absolute;
            bottom: 0;
            left: 110px;
            width: 90px;
            height: 110px;
            background: #7f8c8d;
            border-top: 5px solid #95a5a6;
            border-right: 5px solid #5d6d7e;
            box-shadow: inset 10px 0 0 rgba(0,0,0,0.2);
        }

        .mountain {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-bottom: 110px solid #5a7342;
        }
        .m-1 { right: -20px; border-left: 120px solid transparent; border-right: 120px solid transparent; border-bottom: 120px solid #485c34; }
        .m-2 { right: 140px; border-left: 90px solid transparent; border-right: 90px solid transparent; border-bottom: 95px solid #526b3a; }

        .tree {
            position: absolute;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .tree-leaves {
            width: 46px;
            height: 46px;
            background: #27ae60;
            box-shadow: inset -5px -5px 0px rgba(0,0,0,0.3);
            border: 3px solid #145a32;
        }
        .tree-trunk {
            width: 14px;
            height: 35px;
            background: #784212;
            border: 3px solid #4a2306;
        }
        .tree-1 { left: 35%; bottom: 10px; }
        .tree-2 { right: 30%; bottom: 15px; transform: scale(0.85); }
        .tree-3 { right: 10%; bottom: 5px; transform: scale(0.9); }

        .ground-layer {
            position: absolute;
            bottom: 43vh;
            width: 100%;
            height: 25px;
            background: repeating-linear-gradient(90deg, 
                #27ae60, #27ae60 12px, 
                #e67e22 12px, #e67e22 22px, 
                #27ae60 22px, #27ae60 40px, 
                #e74c3c 40px, #e74c3c 44px, 
                #27ae60 44px, #27ae60 65px, 
                #f1c40f 65px, #f1c40f 69px, 
                #27ae60 69px, #27ae60 90px
            );
            border-top: 4px solid #1e8449;
            z-index: 1;
            filter: brightness(var(--scenery-brightness, 1));
            transition: filter 1s ease;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 12px 0 0 rgba(255, 255, 255, 0.8), -12px 0 0 rgba(255, 255, 255, 0.8);
            animation: moveCloud 25s linear infinite;
            z-index: 1;
            transition: background 1s ease;
        }
        .cloud-1 { width: 70px; height: 22px; top: 12%; left: -90px; animation-duration: 30s; }
        .cloud-2 { width: 90px; height: 26px; top: 22%; left: -120px; animation-duration: 40s; animation-delay: -12s; }

        @keyframes moveCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 180px)); }
        }

        #gameContainerLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 10;
        }

        .falling-fish {
            position: absolute;
            font-size: 2.2rem;
            cursor: pointer;
            pointer-events: auto;
            animation: fallFish linear forwards;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
            transition: transform 0.1s;
        }

        .falling-fish:active {
            transform: scale(1.3);
        }

        @keyframes fallFish {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* SVG Зомби на арене */
        .zombie-mob {
            position: absolute;
            bottom: 44vh;
            width: 70px;
            height: 95px;
            cursor: pointer;
            pointer-events: auto;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.6));
            animation: mobWalk 1.2s ease-in-out infinite alternate;
            z-index: 12;
        }

        /* SVG Скелет на арене */
        .skeleton-mob {
            position: absolute;
            bottom: 44vh;
            width: 70px;
            height: 95px;
            cursor: pointer;
            pointer-events: auto;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.6));
            animation: mobWalk 1.2s ease-in-out infinite alternate;
            z-index: 12;
        }

        @keyframes mobWalk {
            0% { transform: translateY(0) scale(1) rotate(-2deg); }
            100% { transform: translateY(-6px) scale(1.03) rotate(2deg); }
        }

        .zombie-mob:active, .skeleton-mob:active {
            transform: scale(0.8) rotate(15deg);
        }

        .header {
            width: 100%;
            max-width: 420px;
            padding: 15px 20px 10px;
            text-align: center;
            z-index: 3;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffeb3b;
            text-shadow: 3px 3px #000000;
            margin-bottom: 2px;
        }

        .time-indicator {
            font-size: 0.75rem;
            color: #dfe4ea;
            text-shadow: 1px 1px #000;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .score-container {
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 3px 3px #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .level-info {
            font-size: 0.95rem;
            color: #ffeb3b;
            margin-top: 5px;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }

        .level-bar-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            height: 14px;
            border: 2px solid #000;
            margin-top: 8px;
            overflow: hidden;
            position: relative;
        }

        .level-bar-fill {
            height: 100%;
            width: 0%;
            background: #55ff55;
            transition: width 0.3s ease;
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 420px;
            z-index: 3;
        }

        .cat-cube {
            width: 240px;
            height: 240px;
            cursor: grab;
            position: relative;
            animation: float 3s ease-in-out infinite;
            transition: transform 0.05s ease;
            filter: drop-shadow(0 15px 0px rgba(0, 0, 0, 0.5));
        }

        .cat-cube:active {
            cursor: grabbing;
        }

        .cat-cube.petting {
            transform: scale(0.92) translateY(5px);
        }

        .cat-cube.fighting {
            animation: catAttack 0.3s ease infinite alternate;
        }

        @keyframes catAttack {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.05) rotate(-6deg) translateX(-10px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .click-pop {
            position: absolute;
            font-size: 1.8rem;
            font-weight: 900;
            color: #ff7675;
            text-shadow: 2px 2px #000000;
            pointer-events: none;
            animation: popUp 0.6s ease-out forwards;
            z-index: 100;
        }

        @keyframes popUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }

        .upgrades-panel {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 30, 30, 0.95);
            border-top: 4px solid #111;
            border-radius: 14px 14px 0 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 42vh;
            overflow-y: auto;
            z-index: 3;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.7);
        }

        .upgrade-card {
            background: rgba(50, 50, 50, 0.9);
            border: 2px solid #222;
            box-shadow: inset 2px 2px rgba(255,255,255,0.1), inset -2px -2px rgba(0,0,0,0.5);
            border-radius: 6px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .upgrade-card:active {
            transform: scale(0.98);
        }

        .upgrade-info h4 {
            margin: 0 0 2px 0;
            font-size: 0.9rem;
            color: #ffeb3b;
        }

        .upgrade-info p {
            margin: 0;
            font-size: 0.75rem;
            color: #ccc;
        }

        .upgrade-btn {
            background: #727272;
            border: 2px solid #111;
            box-shadow: inset 2px 2px #aaa, inset -2px -2px #444;
            color: white;
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .upgrade-btn.bought {
            background: #33aa33;
            box-shadow: inset 2px 2px #55ff55, inset -2px -2px #226622;
            cursor: default;
        }
    </style>
</head>
<body>

    <div class="celestial-body pixel-sun" id="sunMoon"></div>
    <div class="stars-container" id="starsContainer"></div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>

    <div class="scenery">
        <div class="sand-dune"></div>
        <div class="rock"></div>
        <div class="mountain m-1"></div>
        <div class="mountain m-2"></div>
        <div class="tree tree-1">
            <div class="tree-leaves"></div>
            <div class="tree-trunk"></div>
        </div>
        <div class="tree tree-2">
            <div class="tree-leaves"></div>
            <div class="tree-trunk"></div>
        </div>
        <div class="tree tree-3">
            <div class="tree-leaves"></div>
            <div class="tree-trunk"></div>
        </div>
    </div>
    <div class="ground-layer"></div>

    <div id="gameContainerLayer"></div>

    <div class="header">
        <div class="title">Kotekub Craft</div>
        <div class="time-indicator" id="timeIndicator">☀️ День</div>
        <div class="score-container">
            <span id="score">0</span>
            <span style="font-size: 1.8rem;">📦</span>
        </div>
        <div class="level-info" id="levelInfo">Уровень 1</div>
        <div class="level-bar-container">
            <div class="level-bar-fill" id="levelProgress"></div>
        </div>
    </div>

    <!-- Кубический котик со скин-системой и алмазным мечом -->
    <div class="game-area" id="gameArea">
        <svg class="cat-cube" id="catBtn" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="pixelShadow" x="-10%" y="-10%" width="130%" height="130%">
                    <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#111" flood-opacity="0.5"/>
                </filter>
            </defs>

            <!-- Основное тело кота -->
            <rect id="catBody" x="30" y="50" width="140" height="130" fill="#dedede" stroke="#111" stroke-width="4" filter="url(#pixelShadow)" rx="4"/>
            <rect id="catBodyBottom" x="30" y="140" width="140" height="40" fill="#b5b5b5" rx="2"/>

            <!-- Декоративные полоски для скинов -->
            <g id="catStripes" style="display: none;">
                <rect x="70" y="60" width="60" height="15" fill="#d35400" opacity="0.6"/>
                <rect x="85" y="85" width="30" height="15" fill="#d35400" opacity="0.6"/>
            </g>

            <!-- Ушки -->
            <polygon id="earLeft" points="30,55 15,20 55,45" fill="#333" stroke="#111" stroke-width="3"/>
            <polygon points="35,50 25,28 50,42" fill="#ff91af"/>

            <polygon id="earRight" points="170,55 185,20 145,45" fill="#333" stroke="#111" stroke-width="3"/>
            <polygon points="165,50 175,28 150,42" fill="#ff91af"/>

            <!-- Глаза открытые -->
            <g id="eyesOpen">
                <rect x="60" y="80" width="22" height="22" fill="#111"/>
                <rect x="118" y="80" width="22" height="22" fill="#111"/>
                <rect x="66" y="84" width="8" height="8" fill="#fff"/>
                <rect x="124" y="84" width="8" height="8" fill="#fff"/>
            </g>

            <!-- Глаза счастливые (> <) при глажении -->
            <g id="eyesClosed" style="display: none;">
                <path d="M 60 92 L 71 82 L 82 92" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M 118 92 L 129 82 L 140 92" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
            </g>

            <!-- Носик -->
            <rect x="94" y="106" width="12" height="8" fill="#ff91af"/>

            <!-- Щечки -->
            <rect x="48" y="105" width="14" height="10" fill="#ff7675" opacity="0.8"/>
            <rect x="138" y="105" width="14" height="10" fill="#ff7675" opacity="0.8"/>

            <!-- Лапки -->
            <rect id="pawLeft" x="45" y="165" width="30" height="18" fill="#fff" stroke="#111" stroke-width="3"/>
            <rect id="pawRight" x="125" y="165" width="30" height="18" fill="#fff" stroke="#111" stroke-width="3"/>

            <!-- Алмазный меч (появляется ночью в лапке котика) -->
            <g id="diamondSword" style="display: none; transform: translate(140px, 120px) rotate(-45deg);">
                <rect x="0" y="0" width="8" height="35" fill="#00bcd4" stroke="#006064" stroke-width="2"/>
                <rect x="-4" y="32" width="16" height="6" fill="#795548" stroke="#3e2723" stroke-width="2"/>
                <rect x="2" y="38" width="4" height="10" fill="#5d4037"/>
            </g>
        </svg>
    </div>

    <div class="upgrades-panel">
        <div class="upgrade-card" id="upgClick">
            <div class="upgrade-info">
                <h4>Алмазная кирка (+<span id="clickPowerText">1</span> блок)</h4>
                <p>Добыча за клик</p>
            </div>
            <button class="upgrade-btn" id="btnClickUpg">10 📦</button>
        </div>

        <div class="upgrade-card" id="upgAuto">
            <div class="upgrade-info">
                <h4>Авто-ферма котят (+<span id="autoPowerText">0</span>/сек)</h4>
                <p>Фармит блоки автоматически</p>
            </div>
            <button class="upgrade-btn" id="btnAutoUpg">50 📦</button>
        </div>

        <div class="upgrade-card" id="upgSkinOrange">
            <div class="upgrade-info">
                <h4>🐱 Рыжий котик</h4>
                <p>Красивый огненный скин</p>
            </div>
            <button class="upgrade-btn" id="btnSkinOrange">150 📦</button>
        </div>

        <div class="upgrade-card" id="upgSkinBlack">
            <div class="upgrade-info">
                <h4>🐈‍⬛ Черный кот-ниндзя</h4>
                <p>Стильный темный скин</p>
            </div>
            <button class="upgrade-btn" id="btnSkinBlack">500 📦</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = parseInt(localStorage.getItem('kotekub_score')) || 0;
        let clickPower = parseInt(localStorage.getItem('kotekub_clickPower')) || 1;
        let autoPower = parseInt(localStorage.getItem('kotekub_autoPower')) || 0;
        let clickCost = parseInt(localStorage.getItem('kotekub_clickCost')) || 10;
        let autoCost = parseInt(localStorage.getItem('kotekub_autoCost')) || 50;
        
        let unlockedOrange = localStorage.getItem('kotekub_skin_orange') === 'true';
        let unlockedBlack = localStorage.getItem('kotekub_skin_black') === 'true';
        let currentSkin = localStorage.getItem('kotekub_currentSkin') || 'default';

        const scoreEl = document.getElementById('score');
        const catBtn = document.getElementById('catBtn');
        const eyesOpen = document.getElementById('eyesOpen');
        const eyesClosed = document.getElementById('eyesClosed');
        const levelProgress = document.getElementById('levelProgress');
        const levelInfo = document.getElementById('levelInfo');
        const gameContainerLayer = document.getElementById('gameContainerLayer');

        const btnClickUpg = document.getElementById('btnClickUpg');
        const btnAutoUpg = document.getElementById('btnAutoUpg');
        const clickPowerText = document.getElementById('clickPowerText');
        const autoPowerText = document.getElementById('autoPowerText');

        const catBody = document.getElementById('catBody');
        const catBodyBottom = document.getElementById('catBodyBottom');
        const catStripes = document.getElementById('catStripes');
        const earLeft = document.getElementById('earLeft');
        const earRight = document.getElementById('earRight');
        const pawLeft = document.getElementById('pawLeft');
        const pawRight = document.getElementById('pawRight');
        const diamondSword = document.getElementById('diamondSword');

        const btnSkinOrange = document.getElementById('btnSkinOrange');
        const btnSkinBlack = document.getElementById('btnSkinBlack');

        const sunMoon = document.getElementById('sunMoon');
        const starsContainer = document.getElementById('starsContainer');
        const timeIndicator = document.getElementById('timeIndicator');

        for (let i = 0; i < 20; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.opacity = Math.random() * 0.7 + 0.3;
            starsContainer.appendChild(star);
        }

        let isNightTime = false;
        let gameTimeSeconds = 0;
        
        setInterval(() => {
            gameTimeSeconds = (gameTimeSeconds + 1) % 60;
            isNightTime = gameTimeSeconds >= 30;

            if (isNightTime) {
                document.documentElement.style.setProperty('--sky-bg', 'linear-gradient(to bottom, #0f2027 0%, #203a43 50%, #2c5364 50%, #16222a 100%)');
                document.documentElement.style.setProperty('--scenery-brightness', '0.5');
                sunMoon.className = 'celestial-body pixel-moon';
                starsContainer.style.opacity = '1';
                timeIndicator.textContent = '🌙 Ночь (Зомби атакуют!)';
                catBtn.classList.add('fighting');
                diamondSword.style.display = 'block';
            } else {
                document.documentElement.style.setProperty('--sky-bg', 'linear-gradient(to bottom, #4a90e2 0%, #87ceeb 50%, #76a84c 50%, #4c8225 100%)');
                document.documentElement.style.setProperty('--scenery-brightness', '1');
                sunMoon.className = 'celestial-body pixel-sun';
                starsContainer.style.opacity = '0';
                timeIndicator.textContent = '☀️ День';
                catBtn.classList.remove('fighting');
                diamondSword.style.display = 'none';
            }
        }, 1000);

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playRealisticPurr() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(28, now);
                osc.frequency.linearRampToValueAtTime(34, now + 0.15);
                osc.frequency.linearRampToValueAtTime(26, now + 0.3);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            } catch (e) {}
        }

        function playMeowSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                const now = audioCtx.currentTime;
                
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(650, now + 0.12);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.4);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.4);
            } catch (e) {}
        }

        function playHitSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'square';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.1);
            } catch (e) {}
        }

        function scheduleRandomMeow() {
            const randomTime = Math.random() * 10000 + 12000;
            setTimeout(() => {
                if (!isNightTime) {
                    playMeowSound();
                    eyesOpen.style.display = 'none';
                    eyesClosed.style.display = 'block';
                    setTimeout(() => {
                        eyesOpen.style.display = 'block';
                        eyesClosed.style.display = 'none';
                    }, 400);
                }
                scheduleRandomMeow();
            }, randomTime);
        }
        scheduleRandomMeow();

        let isPetting = false;
        let lastPurrTime = 0;

        catBtn.addEventListener('pointerdown', (e) => {
            isPetting = true;
            catBtn.setPointerCapture(e.pointerId);
            triggerPetAction(e);
        });

        catBtn.addEventListener('pointermove', (e) => {
            if (!isPetting) return;
            const now = Date.now();
            if (now - lastPurrTime > 200) {
                playRealisticPurr();
                lastPurrTime = now;
                
                score += Math.max(1, Math.floor(clickPower / 2));
                updateUI();
                saveGame();
                
                const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 200;
                const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 300;
                createPopText(clientX, clientY, `❤️`);
            }
        });

        function stopPetting() {
            if (!isPetting) return;
            isPetting = false;
            catBtn.classList.remove('petting');
            eyesOpen.style.display = 'block';
            eyesClosed.style.display = 'none';
        }

        catBtn.addEventListener('pointerup', stopPetting);
        catBtn.addEventListener('pointercancel', stopPetting);

        function triggerPetAction(e) {
            score += clickPower;
            
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            playRealisticPurr();

            catBtn.classList.add('petting');
            eyesOpen.style.display = 'none';
            eyesClosed.style.display = 'block';

            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 200;
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 300;
            createPopText(clientX, clientY, `+${clickPower} ❤️`);

            updateUI();
            saveGame();
        }
        // Спавн падающих рыбок днем и ночью
        function spawnFallingFish() {
            const fish = document.createElement('div');
            fish.className = 'falling-fish';
            fish.textContent = '🐟';
            
            const randomX = Math.random() * (window.innerWidth - 60);
            const duration = Math.random() * 3 + 4;
            
            fish.style.left = `${randomX}px`;
            fish.style.animationDuration = `${duration}s`;

            const collectFish = (event) => {
                event.stopPropagation();
                event.preventDefault();
                
                const bonus = Math.max(5, clickPower * 5);
                score += bonus;

                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                playHitSound();
                createPopText(event.clientX || (event.touches ? event.touches[0].clientX : 200), event.clientY || (event.touches ? event.touches[0].clientY : 300), `+${bonus} 🐟`);
                
                fish.remove();
                updateUI();
                saveGame();
            };

            fish.addEventListener('pointerdown', collectFish);
            fish.addEventListener('click', collectFish);

            gameContainerLayer.appendChild(fish);

            setTimeout(() => {
                if (fish.parentNode) {
                    fish.remove();
                }
            }, duration * 1000);
        }

        setInterval(spawnFallingFish, 2500);

        // Спавн мобов (Зомби или Скелет из Майнкрафта по референсам)
        function spawnMob() {
            if (!isNightTime) return;

            const isSkeleton = Math.random() > 0.5;
            const mobEl = document.createElement('div');
            
            if (isSkeleton) {
                mobEl.className = 'skeleton-mob';
                mobEl.innerHTML = `
                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                        <!-- Череп скелета -->
                        <rect x="28" y="2" width="44" height="40" fill="#dcdde1" stroke="#2f3640" stroke-width="3"/>
                        <rect x="36" y="16" width="10" height="10" fill="#2f3640"/>
                        <rect x="54" y="16" width="10" height="10" fill="#2f3640"/>
                        <rect x="40" y="30" width="20" height="4" fill="#2f3640"/>

                        <!-- Позвоночник и ребра -->
                        <rect x="46" y="42" width="8" height="35" fill="#bdc3c7" stroke="#2f3640" stroke-width="2"/>
                        <rect x="36" y="46" width="28" height="6" fill="#bdc3c7" stroke="#2f3640" stroke-width="2"/>
                        <rect x="36" y="56" width="28" height="6" fill="#bdc3c7" stroke="#2f3640" stroke-width="2"/>

                        <!-- Руки с луком -->
                        <rect x="15" y="45" width="25" height="10" fill="#bdc3c7" stroke="#2f3640" stroke-width="2"/>
                        <rect x="60" y="45" width="25" height="10" fill="#bdc3c7" stroke="#2f3640" stroke-width="2"/>
                        <!-- Лук в руках -->
                        <path d="M 75 35 Q 90 50 75 75" stroke="#784212" stroke-width="5" fill="none"/>
                        <line x1="77" y1="37" x2="77" y2="73" stroke="#fff" stroke-width="2"/>

                        <!-- Ноги -->
                        <rect x="36" y="78" width="10" height="38" fill="#bdc3c7" stroke="#2f3640" stroke-width="2"/>
                        <rect x="54" y="78" width="10" height="38" fill="#bdc3c7" stroke="#2f3640" stroke-width="2"/>
                    </svg>
                `;
            } else {
                mobEl.className = 'zombie-mob';
                mobEl.innerHTML = `
                    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                        <rect x="25" y="0" width="50" height="45" fill="#4a7c2d" stroke="#1b360f" stroke-width="3"/>
                        <rect x="35" y="16" width="10" height="6" fill="#e74c3c"/>
                        <rect x="55" y="16" width="10" height="6" fill="#e74c3c"/>
                        <rect x="40" y="28" width="20" height="8" fill="#1b360f"/>
                        <rect x="42" y="30" width="4" height="4" fill="#fff"/>
                        <rect x="50" y="30" width="4" height="4" fill="#fff"/>

                        <rect x="32" y="45" width="36" height="42" fill="#00acc1" stroke="#006064" stroke-width="3"/>
                        <rect x="10" y="48" width="30" height="18" fill="#4a7c2d" stroke="#1b360f" stroke-width="3"/>
                        <rect x="60" y="48" width="30" height="18" fill="#4a7c2d" stroke="#1b360f" stroke-width="3"/>

                        <rect x="34" y="87" width="15" height="30" fill="#5e35b1" stroke="#311b92" stroke-width="2"/>
                        <rect x="51" y="87" width="15" height="30" fill="#5e35b1" stroke="#311b92" stroke-width="2"/>
                    </svg>
                `;
            }

            const isLeft = Math.random() > 0.5;
            let posX = isLeft ? -70 : window.innerWidth + 20;
            const targetX = isLeft ? window.innerWidth / 2 - 80 : window.innerWidth / 2 + 30;
            
            mobEl.style.left = `${posX}px`;

            const killMob = (event) => {
                if(event) {
                    event.stopPropagation();
                    event.preventDefault();
                }

                const reward = (isSkeleton ? 40 : 30) * clickPower;
                score += reward;
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('heavy');
                }

                playHitSound();
                const rect = mobEl.getBoundingClientRect();
                createPopText(rect.left + 35, rect.top, `⚔️ +${reward} XP`);

                mobEl.remove();
                updateUI();
                saveGame();
            };

            mobEl.addEventListener('pointerdown', killMob);
            mobEl.addEventListener('click', killMob);

            gameContainerLayer.appendChild(mobEl);

            let currentX = posX;
            const walkInterval = setInterval(() => {
                if (!mobEl.parentNode || !isNightTime) {
                    clearInterval(walkInterval);
                    if (mobEl.parentNode) mobEl.remove();
                    return;
                }

                if (Math.abs(currentX - targetX) > 10) {
                    currentX += (targetX > currentX) ? 2 : -2;
                    mobEl.style.left = `${currentX}px`;
                } else {
                    // Котик сам атакует мечом дошедшего до него моба!
                    clearInterval(walkInterval);
                    killMob(null);
                }
            }, 30);

            setTimeout(() => {
                clearInterval(walkInterval);
                if (mobEl.parentNode) {
                    mobEl.remove();
                }
            }, 8000);
        }

        // Спавним мобов реже (каждые 3.5 секунды), они стали меньше и котик сам их рубит
        setInterval(spawnMob, 3500);

        function createPopText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'click-pop';
            el.textContent = text;
            
            const offsetX = (Math.random() - 0.5) * 40;
            el.style.left = `${x + offsetX - 15}px`;
            el.style.top = `${y - 40}px`;

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        document.getElementById('upgClick').addEventListener('click', () => {
            if (score >= clickCost) {
                score -= clickCost;
                clickPower += 1;
                clickCost = Math.floor(clickCost * 1.7);
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                updateUI();
                saveGame();
            } else {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        });

        document.getElementById('upgAuto').addEventListener('click', () => {
            if (score >= autoCost) {
                score -= autoCost;
                autoPower += 1;
                autoCost = Math.floor(autoCost * 2.1);
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                updateUI();
                saveGame();
            } else {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        });

        document.getElementById('upgSkinOrange').addEventListener('click', () => {
            if (unlockedOrange) {
                setSkin('orange');
                return;
            }
            if (score >= 150) {
                score -= 150;
                unlockedOrange = true;
                setSkin('orange');
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                updateUI();
                saveGame();
            } else {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        });

        document.getElementById('upgSkinBlack').addEventListener('click', () => {
            if (unlockedBlack) {
                setSkin('black');
                return;
            }
            if (score >= 500) {
                score -= 500;
                unlockedBlack = true;
                setSkin('black');
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                updateUI();
                saveGame();
            } else {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        });

        function setSkin(skinName) {
            currentSkin = skinName;
            if (skinName === 'orange') {
                catBody.setAttribute('fill', '#f39c12');
                catBodyBottom.setAttribute('fill', '#d35400');
                earLeft.setAttribute('fill', '#d35400');
                earRight.setAttribute('fill', '#d35400');
                pawLeft.setAttribute('fill', '#f5b041');
                pawRight.setAttribute('fill', '#f5b041');
                catStripes.style.display = 'block';
            } else if (skinName === 'black') {
                catBody.setAttribute('fill', '#2c3e50');
                catBodyBottom.setAttribute('fill', '#1a252f');
                earLeft.setAttribute('fill', '#1a252f');
                earRight.setAttribute('fill', '#1a252f');
                pawLeft.setAttribute('fill', '#34495e');
                pawRight.setAttribute('fill', '#34495e');
                catStripes.style.display = 'none';
            } else {
                catBody.setAttribute('fill', '#dedede');
                catBodyBottom.setAttribute('fill', '#b5b5b5');
                earLeft.setAttribute('fill', '#333');
                earRight.setAttribute('fill', '#333');
                pawLeft.setAttribute('fill', '#fff');
                pawRight.setAttribute('fill', '#fff');
                catStripes.style.display = 'none';
            }
            updateUI();
        }

        setInterval(() => {
            if (autoPower > 0) {
                score += autoPower;
                updateUI();
                saveGame();
            }
        }, 1000);

        function saveGame() {
            localStorage.setItem('kotekub_score', score);
            localStorage.setItem('kotekub_clickPower', clickPower);
            localStorage.setItem('kotekub_autoPower', autoPower);
            localStorage.setItem('kotekub_clickCost', clickCost);
            localStorage.setItem('kotekub_autoCost', autoCost);
            localStorage.setItem('kotekub_skin_orange', unlockedOrange);
            localStorage.setItem('kotekub_skin_black', unlockedBlack);
            localStorage.setItem('kotekub_currentSkin', currentSkin);
        }

        function updateUI() {
            scoreEl.textContent = score;
            clickPowerText.textContent = clickPower;
            autoPowerText.textContent = autoPower;
            
            btnClickUpg.textContent = `${clickCost} 📦`;
            btnAutoUpg.textContent = `${autoCost} 📦`;

            if (unlockedOrange) {
                btnSkinOrange.textContent = currentSkin === 'orange' ? 'Выбрано' : 'Надеть';
                btnSkinOrange.classList.add('bought');
            } else {
                btnSkinOrange.textContent = '150 📦';
            }

            if (unlockedBlack) {
                btnSkinBlack.textContent = currentSkin === 'black' ? 'Выбрано' : 'Надеть';
                btnSkinBlack.classList.add('bought');
            } else {
                btnSkinBlack.textContent = '500 📦';
            }

            let level = Math.floor(score / 200) + 1;
            let progress = ((score % 200) / 200) * 100;
            
            levelInfo.textContent = `Уровень ${level}`;
            levelProgress.style.width = `${progress}%`;
        }

        setSkin(currentSkin);
        updateUI();
    </script>
</body>
</html>
